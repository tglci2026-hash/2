<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCC App</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="mobile-app">

    <!-- HEADER -->
    <header class="header">

      <div class="profile">

        <div class="avatar"></div>

        <div>
          <h3>Bonjour</h3>
        </div>

      </div>

      <div class="notif-btn">
        🔔
      </div>

    </header>


    <!-- SOLDE -->
    <section class="balance-card">

      <div class="card-glow"></div>

      <small>Solde disponible</small>

      <div class="balance-row">

        <h1 id="balance-text">0 BCC</h1>

        <button id="toggle-balance">
          👁
        </button>

      </div>

      <span class="cfa-text">
        Estimation : 0 FCFA
      </span>

    </section>


    <!-- ACTIONS -->
    <section class="actions">

      <div class="action-btn orange">
        <span>↗</span>
        <p>Envoyer</p>
      </div>

      <div class="action-btn blue">
        <span>↙</span>
        <p>Recevoir</p>
      </div>

      <div class="action-btn purple">
        <span>⌁</span>
        <p>Scanner</p>
      </div>

      <div class="action-btn green">
        <span>⇄</span>
        <p>Convertir</p>
      </div>

    </section>


    <!-- HISTORIQUE -->
    <section class="history">

      <div class="title-row">

        <h2>Historique</h2>

      </div>

    </section>


    <!-- NAVIGATION -->
    <nav class="bottom-nav">

      <a href="#" class="nav-item active">
        <span>⌂</span>
        <p>Accueil</p>
      </a>


      <a href="#" class="nav-item">
        <span>🎁</span>
        <p>Gagner</p>
      </a>


      <div class="bcc-center">
        BCC
      </div>


      <a href="#" class="nav-item">
        <span>👤</span>
        <p>Profil</p>
      </a>

    </nav>

  </div>

  <script src="script.js"></script>

</body>

</html>
